<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>ShortMax</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        "use strict";

        const ua = navigator.userAgent;
        const shortProAppAndroid = /android_ua/i.test(ua);

        function isClip() {
          return (
            /clip/i.test(ua) ||
            window.name === "isClip" ||
            window.navigator.standalone === true ||
            (window.matchMedia &&
              window.matchMedia("(display-mode: standalone)").matches)
          );
        }

        const shouldSetClip = shortProAppAndroid || isClip();

        // 动态创建 iframe
        const iframe = document.createElement("iframe");
        iframe.id = "iframeContainer";
        iframe.allow = "camera; microphone; geolocation; autoplay";
        iframe.sandbox =
          "allow-scripts allow-same-origin allow-forms allow-popups allow-modals";
        iframe.loading = "lazy";

        // ✅ 在设置 src 之前，通过 iframe 的 name 属性设置 window.name 初始值
        if (shouldSetClip) {
          iframe.name = "isClip";
          console.log('[iframe] ✅ iframe.name = "isClip" (set before src)');
        }

        iframe.src = "https://rifestudios.com";
        document.body.appendChild(iframe);

        // 加载完成后发送消息（可选）
        iframe.addEventListener("load", function () {
          if (iframe.contentWindow && shouldSetClip) {
            iframe.contentWindow.postMessage(
              {
                type: "isClip",
                value: true,
                source: "shortMax",
              },
              "*",
            );
          }
        });
      })();
    </script>
  </body>
</html>
